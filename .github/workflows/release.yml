name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-cli:
    name: Build CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p f2png-cli

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/f2png-cli.exe dist/
          else
            cp target/release/f2png-cli dist/
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: f2png-cli-${{ runner.os }}
          path: dist/*

  build-gui:
    name: Build GUI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p f2png-gui

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/f2png-gui.exe dist/
          else
            cp target/release/f2png-gui dist/
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: f2png-gui-${{ runner.os }}
          path: dist/*

  release:
    name: Create release
    runs-on: ubuntu-latest
    needs: [build-cli, build-gui]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
